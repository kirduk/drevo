# Деплой сайта «Мировое Древо» в Amvera.
# Документация: https://docs.amvera.ru/applications/environments/nodejs-server.html

meta:
  environment: node
  toolchain:
    name: npm
    version: "20"

build:
  additionalCommands: npm run build

run:
  command: npm run start
  containerPort: 8080

env:
  NPM_CONFIG_PRODUCTION: "false"
  # SITE_URL — канонический адрес сайта, например https://мировое-древо.рф
  # VITE_SITE_URL — тот же адрес для SEO-тегов при сборке (https://...)
  # VK_ACCESS_TOKEN и VK_PEER_ID (два id через запятую) — задайте в панели Amvera
